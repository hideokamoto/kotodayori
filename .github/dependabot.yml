version: 2
updates:
  # npm dependency updates
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Conventional Commits configuration
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    # PR management
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
    # Group related dependencies
    groups:
      production:
        dependency-type: "production"
      development:
        dependency-type: "development"

  # Standalone StackBlitz demo (npm, depends on published @kotodayori/* packages)
  - package-ecosystem: "npm"
    directory: "/examples/stackblitz-demo"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "npm"
    groups:
      demo:
        patterns:
          - "*"

  # Standalone custom webhooks demo (npm, depends on published @kotodayori/* packages)
  - package-ecosystem: "npm"
    directory: "/examples/custom-webhooks-demo"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "npm"
    groups:
      demo:
        patterns:
          - "*"

  # GitHub Actions workflow updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
