version: 2
updates:
  # npm dependency updates
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Conventional Commits configuration
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    # PR management
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
    # Group related dependencies
    groups:
      production:
        dependency-type: "production"
      development:
        dependency-type: "development"
    # Versions intentionally rolled back in #133 (commit f41c1b6). Without these entries every
    # weekly group PR re-proposes them and fails, which also blocks the safe updates in the group.
    # Remove an entry once its blocker below is gone.
    ignore:
      # astro >=7.4 requires Node >=22.23.4, but the docs deploy on CircleCI
      # (.circleci/docs-release.yml) runs on Node 22.21. Raise that Node version first.
      - dependency-name: "astro"
        versions: [">=7.4.0"]
      # tsup 9 requires Node ^22.18 || ^24.11 || >=26 and vitest 5 requires Node ^22.12 || ^24 || >=26,
      # so the packages could no longer be built and tested on Node 20.
      - dependency-name: "tsup"
        versions: [">=9.0.0"]
      - dependency-name: "vitest"
        versions: [">=5.0.0"]
      # Must stay on the same major as vitest.
      - dependency-name: "@vitest/coverage-v8"
        versions: [">=5.0.0"]

  # Standalone StackBlitz demo (npm, depends on published @kotodayori/* packages)
  - package-ecosystem: "npm"
    directory: "/examples/stackblitz-demo"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "npm"
    groups:
      demo:
        patterns:
          - "*"

  # Standalone custom webhooks demo (npm, depends on published @kotodayori/* packages)
  - package-ecosystem: "npm"
    directory: "/examples/custom-webhooks-demo"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "npm"
    groups:
      demo:
        patterns:
          - "*"

  # GitHub Actions workflow updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
