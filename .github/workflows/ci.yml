name: CI

# lint / typecheck / build / test on Node 24 run on CircleCI
# (pipeline "validate" -> workflows/validation/npm.yaml in
# hideokamoto/circleci-configurations, via multiple config files).
# This workflow only keeps the checks the shared CircleCI template
# does not cover: the oldest supported Node line and the Stripe
# event-map sync check.

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test-node22:
    name: Test (Node 22)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages for tests
        run: pnpm --filter "./packages/*" build

      - name: Run tests
        run: pnpm test

  check-stripe-events:
    name: Check Stripe Events Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Stripe Event Map sync
        run: pnpm --filter @kotodayori/stripe run check-events
